AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: 'ADR Level Breakout Stock Scanner - Serverless Application'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DYNAMODB_TABLE_LEVELS: !Ref ADRLevelsTable
        DYNAMODB_TABLE_CROSSINGS: !Ref CrossingsTable
        DYNAMODB_TABLE_HISTORY: !Ref ScanHistoryTable
        S3_BUCKET_OHLCV: !Ref OHLCVStorageBucket

Resources:
  # ============================================
  # S3 Buckets
  # ============================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'adr-scanner-frontend-${AWS::AccountId}-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  OHLCVStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'adr-scanner-ohlcv-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldOHLCVData
            Status: Enabled
            ExpirationInDays: 730

  # ============================================
  # DynamoDB Tables
  # ============================================
  ADRLevelsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'adr-scanner-levels-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: symbol
          AttributeType: S
        - AttributeName: calculation_date
          AttributeType: S
      KeySchema:
        - AttributeName: symbol
          KeyType: HASH
        - AttributeName: calculation_date
          KeyType: RANGE

  CrossingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'adr-scanner-crossings-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: crossing_id
          AttributeType: S
        - AttributeName: crossing_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: crossing_id
          KeyType: HASH
        - AttributeName: crossing_timestamp
          KeyType: RANGE

  ScanHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'adr-scanner-history-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scan_date
          AttributeType: S
        - AttributeName: scan_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: scan_date
          KeyType: HASH
        - AttributeName: scan_timestamp
          KeyType: RANGE

  UserSettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'adr-scanner-user-settings-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  # ============================================
  # Cognito Authentication
  # ============================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'adr-scanner-pool-${Environment}'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: adr-scanner-client
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ADMIN_NO_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ============================================
  # API Gateway
  # ============================================
  ADRScannerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      TracingEnabled: false

  # ============================================
  # Lambda Functions
  # ============================================
  
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'adr-scanner-login-${Environment}'
      CodeUri: backend/functions/auth/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserSettingsTable
      Events:
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref ADRScannerApi
            Path: /auth/login
            Method: POST

  ADRCalculationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'adr-scanner-calculation-${Environment}'
      CodeUri: backend/functions/adr_calculation/
      Handler: app.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ADRLevelsTable
        - S3CrudPolicy:
            BucketName: !Ref OHLCVStorageBucket
      Events:
        ScheduledTrigger:
          Type: Schedule
          Properties:
            Schedule: 'cron(0 9 ? * MON-FRI *)'

  CrossingDetectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'adr-scanner-crossing-${Environment}'
      CodeUri: backend/functions/crossing_detection/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CrossingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ADRLevelsTable

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'adr-scanner-dashboard-${Environment}'
      CodeUri: backend/functions/dashboard/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CrossingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ADRLevelsTable
      Events:
        GetCrossingsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ADRScannerApi
            Path: /api/crossings
            Method: GET
        GetHistoryApi:
          Type: Api
          Properties:
            RestApiId: !Ref ADRScannerApi
            Path: /api/history
            Method: GET

  AIAssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'adr-scanner-ai-${Environment}'
      CodeUri: backend/functions/ai_assistant/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CrossingsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
      Events:
        ChatApi:
          Type: Api
          Properties:
            RestApiId: !Ref ADRScannerApi
            Path: /api/chat
            Method: POST

  # ============================================
  # SNS & SQS for Alerts
  # ============================================
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'adr-scanner-alerts-${Environment}'
      DisplayName: ADR Scanner Alerts

  AlertQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'adr-scanner-alert-queue-${Environment}'
      VisibilityTimeout: 300

  AlertQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AlertQueue
      PolicyText:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AlertQueue.Arn
            Condition:
              ArnEquals:
                'aws:SourceArn': !Ref AlertTopic

  SNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      TopicArn: !Ref AlertTopic
      Endpoint: !GetAtt AlertQueue.Arn

  WhatsAppAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'adr-scanner-whatsapp-${Environment}'
      CodeUri: backend/functions/whatsapp_alert/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserSettingsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt AlertQueue.Arn
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AlertQueue.Arn
            BatchSize: 10

Outputs:
  ApiEndpoint:
    Description: API Gateway Endpoint
    Value: !Sub 'https://${ADRScannerApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub '${AWS::StackName}-CognitoUserPoolId'

  CognitoClientId:
    Description: Cognito Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-CognitoClientId'

  S3BucketName:
    Description: Frontend S3 Bucket
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucket'
