AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: 'ADR Level Breakout Stock Scanner - Serverless Application'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DYNAMODB_TABLE_CROSSINGS: !Ref CrossingsTable
        DYNAMODB_TABLE_HISTORY: !Ref ScanHistoryTable
        S3_BUCKET_OHLCV: !Ref OHLCVStorageBucket

Resources:
  # ============================================
  # S3 Buckets
  # ============================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'adr-frontend-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      VersioningConfiguration:
        Status: Enabled

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  OHLCVStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'adr-ohlcv-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled

  # ============================================
  # DynamoDB Tables
  # ============================================
  CrossingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'adr-crossings-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: crossing_id
          AttributeType: S
        - AttributeName: crossing_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: crossing_id
          KeyType: HASH
        - AttributeName: crossing_timestamp
          KeyType: RANGE

  ScanHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'adr-history-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scan_date
          AttributeType: S
        - AttributeName: scan_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: scan_date
          KeyType: HASH
        - AttributeName: scan_timestamp
          KeyType: RANGE

  UserSettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'adr-settings-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  # ============================================
  # Cognito Authentication
  # ============================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'adr-scanner-pool-${Environment}'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: adr-scanner-client
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ============================================
  # Lambda Functions
  # ============================================
  
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'adr-scanner-login-${Environment}'
      CodeUri: backend/functions/auth/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserSettingsTable

  CrossingDetectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'adr-scanner-crossing-${Environment}'
      CodeUri: backend/functions/crossing_detection/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CrossingsTable
      Events:
        DummyEvent:
          Type: Schedule
          Properties:
            Schedule: 'rate(30 minutes)'
            Enabled: false

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'adr-scanner-dashboard-${Environment}'
      CodeUri: backend/functions/dashboard/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CrossingsTable

Outputs:
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub '${AWS::StackName}-CognitoUserPoolId'

  CognitoClientId:
    Description: Cognito Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-CognitoClientId'

  S3BucketName:
    Description: Frontend S3 Bucket
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucket'
