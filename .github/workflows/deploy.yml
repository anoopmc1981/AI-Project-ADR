name: Deploy ADR Scanner to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

permissions:
  id-token: write     # Required for OIDC token
  contents: read      # Required for checkout
  issues: write       # For posting comments on issues

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  STACK_NAME: adr-scanner-dev
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # 3. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Verify AWS Connection
      - name: Verify AWS Credentials
        run: |
          echo "🔐 Verifying AWS credentials..."
          aws sts get-caller-identity
          aws iam get-user 2>/dev/null || echo "Using role-based access"

      # 5. Install SAM CLI
      - name: Install AWS SAM CLI
        run: |
          echo "📦 Installing SAM CLI..."
          pip install --upgrade pip
          pip install aws-sam-cli
          sam --version

      # 6. Install Python Dependencies
      - name: Install Backend Dependencies
        run: |
          echo "📚 Installing Python dependencies..."
          pip install -r backend/requirements.txt

      # 7. Deploy API Gateway Stack (if not exists)
      - name: Deploy API Gateway
        continue-on-error: true
        run: |
          echo "🔌 Deploying API Gateway..."
          aws cloudformation deploy \
            --template-file template-cf.yaml \
            --stack-name adr-scanner-api \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # 8. Package ADR Lambda with Dependencies using Python
      - name: Package ADR Lambda Function
        run: |
          echo "📦 Packaging ADR Lambda with dependencies..."
          
          # Create temp directory
          rm -rf lambda_package adr_lambda.zip
          mkdir -p lambda_package
          
          # Install dependencies to package directory
          pip install -q -r backend/requirements.txt -t lambda_package/
          
          # Copy Lambda function - rename to index.py for handler compatibility
          cp backend/functions/adr_calculation/app.py lambda_package/index.py
          
          # List contents for debugging
          ls -la lambda_package/ | head -10
          
          # Create ZIP archive
          cd lambda_package
          zip -q -r ../adr_lambda.zip .
          cd ..
          
          # Verify ZIP contents
          echo "ZIP file contents:"
          unzip -l adr_lambda.zip | head -20
          
          # Upload to S3
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="adr-ohlcv-${ACCOUNT_ID}"
          
          echo "Uploading to S3: $BUCKET_NAME"
          aws s3 cp adr_lambda.zip s3://${BUCKET_NAME}/lambda-code/adr_lambda.zip --region ${{ env.AWS_REGION }}
          
          echo "✅ ADR Lambda packaged successfully"

      # 9. Update ADR Lambda Function Code
      - name: Update ADR Lambda Function
        run: |
          echo "🚀 Updating ADR Lambda function..."
          
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="adr-ohlcv-${ACCOUNT_ID}"
          
          # Update function code from S3
          aws lambda update-function-code \
            --function-name adr-calculation-dev \
            --s3-bucket ${BUCKET_NAME} \
            --s3-key lambda-code/adr_lambda.zip \
            --region ${{ env.AWS_REGION }}
          
          # Wait longer for update to complete
          echo "Waiting for update to complete..."
          sleep 30
          
          # Update handler to point to index.py
          aws lambda update-function-configuration \
            --function-name adr-calculation-dev \
            --handler index.lambda_handler \
            --region ${{ env.AWS_REGION }}
          
          # Wait for configuration update
          sleep 10
          
          echo "✅ ADR Lambda updated successfully"

      # 10. Update Dashboard Lambda Function Code
      - name: Package and Update Dashboard Lambda
        run: |
          echo "🚀 Packaging Dashboard Lambda..."
          
          # Create temp package
          rm -rf dashboard_package dashboard_lambda.zip
          mkdir -p dashboard_package
          
          # Copy dashboard function
          cp backend/functions/dashboard/app.py dashboard_package/index.py
          
          # Create ZIP
          cd dashboard_package
          zip -q -r ../dashboard_lambda.zip .
          cd ..
          
          # Upload to S3
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="adr-ohlcv-${ACCOUNT_ID}"
          
          aws s3 cp dashboard_lambda.zip s3://${BUCKET_NAME}/lambda-code/dashboard_lambda.zip --region ${{ env.AWS_REGION }}
          
          # Update Lambda code
          aws lambda update-function-code \
            --function-name adr-scanner-dashboard-dev-v2 \
            --s3-bucket ${BUCKET_NAME} \
            --s3-key lambda-code/dashboard_lambda.zip \
            --region ${{ env.AWS_REGION }}
          
          # Wait longer for update
          echo "Waiting for update to complete..."
          sleep 30
          
          # Update handler
          aws lambda update-function-configuration \
            --function-name adr-scanner-dashboard-dev-v2 \
            --handler index.lambda_handler \
            --region ${{ env.AWS_REGION }}
          
          sleep 10
          echo "✅ Dashboard Lambda updated"

      # 11. Build Frontend
      - name: Build React Frontend
        run: |
          echo "🔨 Building React frontend..."
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          echo "✅ Frontend build complete"

      # 12. Deploy Frontend to S3
      - name: Deploy Frontend to S3
        run: |
          echo "🌐 Deploying frontend to S3..."
          
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="adr-frontend-${ACCOUNT_ID}"
          
          # Check if bucket exists
          if ! aws s3 ls "s3://${BUCKET_NAME}" --region ${{ env.AWS_REGION }} 2>&1 | grep -q 'NoSuchBucket'; then
            echo "Bucket exists: $BUCKET_NAME"
          else
            echo "Creating bucket: $BUCKET_NAME"
            aws s3 mb "s3://${BUCKET_NAME}" --region ${{ env.AWS_REGION }}
            
            # Disable Block Public Access
            aws s3api put-public-access-block \
              --bucket ${BUCKET_NAME} \
              --region ${{ env.AWS_REGION }} \
              --public-access-block-configuration "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"
            
            sleep 5
            
            # Add bucket policy for public access
            aws s3api put-bucket-policy \
              --bucket ${BUCKET_NAME} \
              --region ${{ env.AWS_REGION }} \
              --policy '{
                "Version": "2012-10-17",
                "Statement": [{
                  "Effect": "Allow",
                  "Principal": "*",
                  "Action": "s3:GetObject",
                  "Resource": "arn:aws:s3:::'"${BUCKET_NAME}"'/*"
                }]
              }'
            
            # Enable website hosting
            aws s3 website "s3://${BUCKET_NAME}" \
              --index-document index.html \
              --error-document index.html \
              --region ${{ env.AWS_REGION }}
          fi
          
          # Sync frontend build
          aws s3 sync frontend/build "s3://${BUCKET_NAME}/" --delete --region ${{ env.AWS_REGION }}
          
          echo "✅ Frontend deployed to: http://${BUCKET_NAME}.s3-website.${{ env.AWS_REGION }}.amazonaws.com"
