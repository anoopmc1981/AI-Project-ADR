name: Deploy ADR Scanner to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

permissions:
  id-token: write     # Required for OIDC token
  contents: read      # Required for checkout
  issues: write       # For posting comments on issues

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  STACK_NAME: adr-scanner-dev
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # 3. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Verify AWS Connection
      - name: Verify AWS Credentials
        run: |
          echo "🔐 Verifying AWS credentials..."
          aws sts get-caller-identity
          aws iam get-user 2>/dev/null || echo "Using role-based access"

      # 5. Install SAM CLI
      - name: Install AWS SAM CLI
        run: |
          echo "📦 Installing SAM CLI..."
          pip install --upgrade pip
          pip install aws-sam-cli
          sam --version

      # 6. Install Python Dependencies
      - name: Install Backend Dependencies
        run: |
          echo "📚 Installing Python dependencies..."
          pip install -r backend/requirements.txt

      # 7. Deploy S3 Bucket Stack
      - name: Deploy S3 Bucket
        run: |
          echo "📦 Deploying S3 frontend bucket..."
          aws cloudformation deploy \
            --template-file template-s3.yaml \
            --stack-name adr-frontend-stack \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset

      # 8. Deploy API Gateway Stack
      - name: Deploy API Gateway
        run: |
          echo "🔌 Deploying API Gateway..."
          aws cloudformation deploy \
            --template-file template-cf.yaml \
            --stack-name adr-scanner-api \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # 9. Package ADR Lambda with Dependencies
      - name: Package ADR Lambda
        run: |
          echo "📦 Packaging ADR Lambda with dependencies..."
          
          # Create deployment directory
          mkdir -p adr_lambda_package/python
          
          # Install dependencies
          pip install -r backend/requirements.txt -t adr_lambda_package/python/ --quiet
          
          # Copy Lambda function
          cp backend/functions/adr_calculation/app.py adr_lambda_package/
          
          # Create ZIP
          cd adr_lambda_package
          python -m zipfile -c adr_lambda.zip app.py python/
          cd ..
          
          # Upload to S3
          aws s3 cp adr_lambda_package/adr_lambda.zip s3://adr-ohlcv-${{ env.AWS_ACCOUNT_ID }}/lambda-code/adr_lambda.zip --region ${{ env.AWS_REGION }}

      # 10. Update ADR Lambda Function
      - name: Deploy ADR Lambda Function
        run: |
          echo "🚀 Deploying ADR Lambda function..."
          
          # Get account ID
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          # Update function code
          aws lambda update-function-code \
            --function-name adr-calculation-dev \
            --s3-bucket adr-ohlcv-$ACCOUNT_ID \
            --s3-key lambda-code/adr_lambda.zip \
            --region ${{ env.AWS_REGION }}
          
          # Wait for update to complete
          sleep 5
          
          echo "✅ ADR Lambda updated"

      # 11. Deploy Dashboard Lambda
      - name: Deploy Dashboard Lambda
        run: |
          echo "🚀 Deploying Dashboard Lambda function..."
          
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          # Package dashboard function
          zip -j dashboard_lambda.zip backend/functions/dashboard/app.py
          
          # Upload to S3
          aws s3 cp dashboard_lambda.zip s3://adr-ohlcv-$ACCOUNT_ID/lambda-code/dashboard_lambda.zip --region ${{ env.AWS_REGION }}
          
          # Update function code
          aws lambda update-function-code \
            --function-name adr-scanner-dashboard-dev-v2 \
            --s3-bucket adr-ohlcv-$ACCOUNT_ID \
            --s3-key lambda-code/dashboard_lambda.zip \
            --region ${{ env.AWS_REGION }}
          
          sleep 5
          echo "✅ Dashboard Lambda updated"

      # 12. Build Frontend
      - name: Build Frontend
        run: |
          echo "🔨 Building React frontend..."
          cd frontend
          npm install
          npm run build
          cd ..

      # 13. Deploy Frontend to S3
      - name: Deploy Frontend to S3
        run: |
          echo "🌐 Deploying frontend to S3..."
          
          # Get S3 bucket name
          S3_BUCKET=$(aws s3 ls | grep adr-frontend | awk '{print $3}')
          
          if [ -z "$S3_BUCKET" ]; then
            echo "Using default bucket"
            S3_BUCKET="adr-frontend-$(aws sts get-caller-identity --query Account --output text)"
          fi
          
          echo "📤 Syncing to: $S3_BUCKET"
          
          aws s3 sync frontend/build s3://$S3_BUCKET/ \
            --delete \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Frontend deployed"
